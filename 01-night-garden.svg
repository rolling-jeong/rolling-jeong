<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">파란 장미밭 위의 와라와라들</title>

  <style>
    /* 와라와라: 한 픽셀(8) 깡총 */
    .hop  { animation: hop 2s steps(1) infinite; }
    @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    /* 별: 깜빡깜빡 */
    .star { animation: tw 3s steps(1) infinite; }
    @keyframes tw  { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <defs>
    <!-- 와라와라 A: 입 벌리고 활짝 (14x14 픽셀, 1픽셀=8) -->
    <g id="warawara">
    <path fill="#fff9e9" d="M32 0h48v8h-48zM16 8h80v8h-80zM8 16h96v16h-96zM0 32h24v8h-24zM32 32h48v8h-48zM88 32h24v8h-24zM0 40h112v8h-112zM0 48h16v8h-16zM24 48h16v8h-16zM72 48h16v8h-16zM96 48h16v8h-16zM0 56h40v8h-40zM72 56h40v8h-40zM0 64h48v8h-48zM64 64h48v8h-48zM0 72h112v16h-112zM16 88h80v8h-80zM24 104h16v8h-16zM72 104h16v8h-16z"/>
    <path fill="#102b37" d="M24 32h8v8h-8zM80 32h8v8h-8z"/>
    <path fill="#efb0bd" d="M16 48h8v8h-8zM88 48h8v8h-8z"/>
    <path fill="#bd6380" d="M40 48h32v16h-32zM48 64h16v8h-16z"/>
    <path fill="#bdcee3" d="M8 88h8v8h-8zM96 88h8v8h-8zM16 96h80v8h-80z"/>
    </g>
    <!-- 와라와라 B: 눈 감고 방긋 -->
    <g id="warawara-smile">
    <path fill="#fff9e9" d="M32 0h48v8h-48zM16 8h80v8h-80zM8 16h96v16h-96zM0 32h16v8h-16zM32 32h48v8h-48zM96 32h16v8h-16zM0 40h112v8h-112zM0 48h16v8h-16zM24 48h16v8h-16zM48 48h16v8h-16zM72 48h16v8h-16zM96 48h16v8h-16zM0 56h48v8h-48zM64 56h48v8h-48zM0 64h112v24h-112zM16 88h80v8h-80zM24 104h16v8h-16zM72 104h16v8h-16z"/>
    <path fill="#102b37" d="M16 32h16v8h-16zM80 32h16v8h-16z"/>
    <path fill="#efb0bd" d="M16 48h8v8h-8zM88 48h8v8h-8z"/>
    <path fill="#bd6380" d="M40 48h8v8h-8zM64 48h8v8h-8zM48 56h16v8h-16z"/>
    <path fill="#bdcee3" d="M8 88h8v8h-8zM96 88h8v8h-8zM16 96h80v8h-80z"/>
    </g>
    <!-- 파란 장미 (7x10 픽셀, 1픽셀=5) -->
    <g id="rose">
    <path fill="#0641c9" d="M10 0h15v5h-15zM5 5h10v5h-10zM25 5h5v5h-5zM0 10h5v10h-5zM10 10h10v5h-10zM30 10h5v10h-5zM15 15h5v5h-5zM5 20h10v5h-10zM25 20h5v5h-5zM10 25h15v5h-15z"/>
    <path fill="#149bff" d="M15 5h10v5h-10zM5 10h5v5h-5zM20 10h10v10h-10zM5 15h10v5h-10zM15 20h10v5h-10z"/>
    <path fill="#427c42" d="M0 30h5v5h-5zM15 30h5v5h-5zM30 30h5v5h-5zM5 35h25v5h-25zM15 40h5v10h-5z"/>
    </g>
    <!-- 보름달 (10x10 픽셀, 1픽셀=6) -->
    <g id="moon">
    <path fill="#f4efd0" d="M18 0h24v6h-24zM6 6h48v6h-48zM0 12h60v6h-60zM0 18h12v12h-12zM24 18h36v6h-36zM24 24h24v6h-24zM54 24h6v12h-6zM0 30h42v6h-42zM0 36h24v6h-24zM30 36h30v6h-30zM0 42h60v6h-60zM6 48h48v6h-48zM18 54h24v6h-24z"/>
    <path fill="#d9d2a8" d="M12 18h12v12h-12zM48 24h6v6h-6zM42 30h12v6h-12zM24 36h6v6h-6z"/>
    </g>
  </defs>

  <!-- 밤하늘 -->
  <rect width="1200" height="320" fill="#0b202e"/>
  <!-- 보름달 (바깥 은은한 빛 + 달) -->
  <use href="#moon" transform="translate(1005 21) scale(1.5)" opacity=".1"/>
  <use href="#moon" x="1020" y="36"/>
  <g fill="#8caec0">
    <rect class="star" style="animation-delay:-0.0s" x="70" y="40" width="5" height="5"/>
    <rect class="star" style="animation-delay:-0.37s" x="238" y="58" width="5" height="5"/>
    <rect class="star" style="animation-delay:-0.74s" x="510" y="38" width="5" height="5"/>
    <rect class="star" style="animation-delay:-1.11s" x="732" y="60" width="5" height="5"/>
    <rect class="star" style="animation-delay:-1.48s" x="900" y="70" width="5" height="5"/>
    <rect class="star" style="animation-delay:-1.85s" x="1150" y="110" width="5" height="5"/>
    <rect class="star" style="animation-delay:-2.22s" x="160" y="120" width="5" height="5"/>
    <rect class="star" style="animation-delay:-2.59s" x="640" y="24" width="5" height="5"/>
  </g>

  <!-- 풀밭 -->
  <rect y="278" width="1200" height="42" fill="#143d3b"/>
  <rect y="278" width="1200" height="4" fill="#1d5650"/>

  <!-- 뒤쪽 장미 몇 송이 (작고 살짝 흐리게) -->
  <g opacity=".75">
    <use href="#rose" transform="translate(150 236) scale(.8)"/>
    <use href="#rose" transform="translate(560 238) scale(.8)"/>
    <use href="#rose" transform="translate(880 236) scale(.8)"/>
    <use href="#rose" transform="translate(1030 238) scale(.8)"/>
  </g>

  <!-- 와라와라들 (translate=위치, scale=크기, 안쪽 hop=깡총) -->
  <g transform="translate(400 111) scale(1.4)">
    <g class="hop" style="animation-duration:2.2s;animation-delay:-0.0s">
      <use href="#warawara"/>
      <use href="#rose" x="39" y="69"/>  <!-- 안고 있는 장미 -->
    </g>
  </g>
  <g transform="translate(640 150) scale(1.0)">
    <g class="hop" style="animation-duration:1.8s;animation-delay:-0.8s">
      <use href="#warawara-smile"/>
      <use href="#rose" x="39" y="69"/>  <!-- 안고 있는 장미 -->
    </g>
  </g>

  <!-- 앞쪽 장미 (드문드문, x y 로 위치 조절) -->
  <use href="#rose" x="70" y="262"/>
  <use href="#rose" x="250" y="268"/>
  <use href="#rose" x="800" y="264"/>
  <use href="#rose" x="960" y="270"/>
  <use href="#rose" x="1100" y="262"/>
</svg>
